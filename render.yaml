services:
  - type: web
    name: contextswitch-api
    runtime: node
    # Free services have ephemeral storage; SQLite data is reset on a restart
    # or redeploy. Upgrade to a paid plan and restore the disk configuration
    # when durable persistence is required.
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      # Set after Vercel assigns the production frontend URL.
      - key: CORS_ORIGINS
        sync: false
      # Optional: the deterministic fallback is used when absent or on failure.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
