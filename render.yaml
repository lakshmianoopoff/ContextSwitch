services:
  - type: web
    name: contextswitch-api
    runtime: node
    # Persistent disks require a paid Render web-service plan.
    plan: 0.5c-512mb
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_PATH
        value: /var/data/contextswitch.db
      # Set after Vercel assigns the production frontend URL.
      - key: CORS_ORIGINS
        sync: false
      # Optional: the deterministic fallback is used when absent or on failure.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
    disk:
      name: contextswitch-data
      mountPath: /var/data
      sizeGB: 1
